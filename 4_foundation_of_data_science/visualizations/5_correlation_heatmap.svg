      </linearGradient>
    </defs>
    <rect x="0" y="0" width="450" height="15" rx="3" fill="url(#heatGrad)" />
    <text x="0" y="32" font-size="11" fill="#64748b">0.0 (No Correlation)</text>
    <text x="225" y="32" font-size="11" fill="#64748b" text-anchor="middle">0.5 (Moderate)</text>
