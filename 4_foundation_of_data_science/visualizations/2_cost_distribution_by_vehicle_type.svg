<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="425" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Maintenance Expenditure Distribution by Vehicle Type (₹)</text>
  <text x="425" y="65" text-anchor="middle" font-size="13" fill="#64748b">Box-and-Whisker Plot showing Medians, IQRs, and High-Cost Anomaly Outliers</text>

  <!-- Y Axis Grid & Labels (₹0 to ₹10,000) -->
  <!-- Origin Y=420 (₹0), Y=100 (₹10,000). Height = 320px -> 32px per ₹1,000 -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4">
    <line x1="80" y1="420" x2="800" y2="420" />
    <line x1="80" y1="356" x2="800" y2="356" />
    <line x1="80" y1="292" x2="800" y2="292" />
    <line x1="80" y1="228" x2="800" y2="228" />
    <line x1="80" y1="164" x2="800" y2="164" />
    <line x1="80" y1="100" x2="800" y2="100" />
  </g>

  <g font-size="12" fill="#64748b" text-anchor="end">
    <text x="70" y="425">₹0</text>
    <text x="70" y="361">₹2,000</text>
    <text x="70" y="297">₹4,000</text>
    <text x="70" y="233">₹6,000</text>
    <text x="70" y="169">₹8,000</text>
    <text x="70" y="105">₹10,000</text>
  </g>

  <!-- Box 1: SUV (Center X=160) -->
  <!-- Min 2065 (Y=354), Q1 3776 (Y=299), Med 4637 (Y=272), Q3 8295 (Y=155), Max 9440 (Y=118) -->
  <line x1="160" y1="299" x2="160" y2="354" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="354" x2="180" y2="354" stroke="#1e293b" stroke-width="2" />
  <line x1="160" y1="155" x2="160" y2="118" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="118" x2="180" y2="118" stroke="#1e293b" stroke-width="2" />
  <rect x="120" y="155" width="80" height="144" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" />
  <line x1="120" y1="272" x2="200" y2="272" stroke="#b91c1c" stroke-width="3" />
  <!-- Mean indicator circle -->
  <circle cx="160" cy="245" r="4" fill="#dc2626" />
  <text x="160" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">SUV</text>
  <text x="160" y="465" text-anchor="middle" font-size="11" fill="#64748b">(n=7)</text>

  <!-- Box 2: TRUCK (Center X=300) -->
  <!-- Min 4484 (Y=276), Q1 5487 (Y=244), Med 6490 (Y=212), Q3 7257 (Y=188), Max 8024 (Y=163) -->
  <line x1="300" y1="244" x2="300" y2="276" stroke="#1e293b" stroke-width="2" />
  <line x1="280" y1="276" x2="320" y2="276" stroke="#1e293b" stroke-width="2" />
  <line x1="300" y1="188" x2="300" y2="163" stroke="#1e293b" stroke-width="2" />
  <line x1="280" y1="163" x2="320" y2="163" stroke="#1e293b" stroke-width="2" />
  <rect x="260" y="188" width="80" height="56" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
  <line x1="260" y1="212" x2="340" y2="212" stroke="#b91c1c" stroke-width="3" />
  <circle cx="300" cy="218" r="4" fill="#dc2626" />
  <text x="300" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">TRUCK</text>
  <text x="300" y="465" text-anchor="middle" font-size="11" fill="#64748b">(n=3)</text>

  <!-- Box 3: SEDAN (Center X=440) -->
  <!-- Min 4425 (Y=278), Q1 4678 (Y=270), Med 4932 (Y=262), Q3 5074 (Y=258), Max 5215 (Y=253) -->
  <line x1="440" y1="270" x2="440" y2="278" stroke="#1e293b" stroke-width="2" />
  <line x1="420" y1="278" x2="460" y2="278" stroke="#1e293b" stroke-width="2" />
  <line x1="440" y1="258" x2="440" y2="253" stroke="#1e293b" stroke-width="2" />
  <line x1="420" y1="253" x2="460" y2="253" stroke="#1e293b" stroke-width="2" />
  <rect x="400" y="258" width="80" height="12" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="2" />
  <line x1="400" y1="262" x2="480" y2="262" stroke="#b91c1c" stroke-width="3" />
  <circle cx="440" cy="264" r="4" fill="#dc2626" />
  <text x="440" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">SEDAN</text>
  <text x="440" y="465" text-anchor="middle" font-size="11" fill="#64748b">(n=3)</text>

  <!-- Box 4: HATCHBACK (Center X=580) -->
  <!-- Min 3280 (Y=315), Q1 3587 (Y=305), Med 4277 (Y=283), Q3 5074 (Y=258), Max 5487 (Y=244) -->
  <line x1="580" y1="305" x2="580" y2="315" stroke="#1e293b" stroke-width="2" />
  <line x1="560" y1="315" x2="600" y2="315" stroke="#1e293b" stroke-width="2" />
  <line x1="580" y1="258" x2="580" y2="244" stroke="#1e293b" stroke-width="2" />
  <line x1="560" y1="244" x2="600" y2="244" stroke="#1e293b" stroke-width="2" />
  <rect x="540" y="258" width="80" height="47" rx="4" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2" />
  <line x1="540" y1="283" x2="620" y2="283" stroke="#b91c1c" stroke-width="3" />
  <circle cx="580" cy="281" r="4" fill="#dc2626" />
  <text x="580" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">HATCHBACK</text>
  <text x="580" y="465" text-anchor="middle" font-size="11" fill="#64748b">(n=4)</text>

  <!-- Box 5: TWO_WHEELER (Center X=720) -->
  <!-- Min 1239 (Y=380), Q1 1652 (Y=367), Med 2065 (Y=354), Q3 2065 (Y=354), Max 2065 (Y=354) -->
  <line x1="720" y1="367" x2="720" y2="380" stroke="#1e293b" stroke-width="2" />
  <line x1="700" y1="380" x2="740" y2="380" stroke="#1e293b" stroke-width="2" />
  <rect x="680" y="354" width="80" height="13" rx="4" fill="#fbcfe8" stroke="#be185d" stroke-width="2" />
  <line x1="680" y1="354" x2="760" y2="354" stroke="#b91c1c" stroke-width="3" />
  <!-- Outlier point: Battery replacement ₹7,139 (Y=191) -->
  <circle cx="720" cy="191" r="5" fill="#f43f5e" stroke="#881337" stroke-width="2" />
  <text x="735" y="195" font-size="10" font-weight="bold" fill="#881337">₹7,139 (Outlier)</text>
  <circle cx="720" cy="360" r="4" fill="#dc2626" />
  <text x="720" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">TWO_WHEELER</text>
  <text x="720" y="465" text-anchor="middle" font-size="11" fill="#64748b">(n=3)</text>

  <!-- Legend -->
  <rect x="580" y="75" width="220" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <line x1="590" y1="90" x2="615" y2="90" stroke="#b91c1c" stroke-width="3" />
  <text x="625" y="94" font-size="11" fill="#334155">Median Cost</text>
  <circle cx="602" cy="107" r="4" fill="#dc2626" />
  <text x="625" y="111" font-size="11" fill="#334155">Mean Cost (Red Dot)</text>
</svg>
